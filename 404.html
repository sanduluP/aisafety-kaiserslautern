<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — AI Safety Kaiserslautern</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12305E">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/assets/img/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/styles.css">
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</head>
<body>

<main id="main" class="legal">
  <div class="wrap" style="text-align:center">
    <img class="brand-mark" src="assets/img/logo-mark-192.png" alt="" width="131" height="192"
         style="height:96px;margin-bottom:1.5rem">
    <p class="eyebrow">Error 404</p>
    <h1>This page does not exist</h1>
    <p style="max-width:46ch;margin-inline:auto">
      The link may be out of date, or there may be a typo in the address.
      Everything the site has is on the homepage.
    </p>
    <p class="btn-row" style="justify-content:center">
      <a class="btn btn-primary" href="/">Go to the homepage</a>
      <a class="btn btn-ghost" href="/#join">Join the community</a>
    </p>
  </div>
</main>

<script src="assets/js/main.js"></script>
</body>
</html>
